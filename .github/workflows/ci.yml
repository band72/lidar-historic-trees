name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: "3.10"}
          - {os: ubuntu-24.04, python: "3.12"}
          # Windows too, so a Windows-only failure shows up on every push, not first at release
          - {os: windows-2022, python: "3.12"}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: System libraries for Open3D
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libgomp1

      - name: Install (builds the quickshift++ extension)
        run: |
          python -m pip install --upgrade pip
          pip install ".[test,app,las]" rosbags ruff

      - name: Lint new modules
        if: runner.os == 'Linux'
        run: make lint

      - name: Tests
        env:
          LOG_LEVEL: warn
        # the package lives under python/, so this imports the installed (built) copy
        run: python -m pytest -q tests -p no:cacheprovider

      - name: CLI smoke test
        run: |
          cd "$RUNNER_TEMP"
          fip demo-data demo/plot.ply --n-trees 10
          fip inventory demo/plot.ply -o out --plugin-dir "$GITHUB_WORKSPACE/plugins" -e csv -e dxf -e geojson -e points
          test -s out/trees.csv && test -s out/trees.dxf && test -s out/trees.geojson && test -s out/trees.laz && test -s out/run.json
