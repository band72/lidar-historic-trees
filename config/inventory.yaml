# Config for `fip inventory INPUT -c config/inventory.yaml`. Every key is optional;
# values shown are the defaults. Lengths in metres (always, even when the cloud is in feet:
# --units ft converts the cloud; config values stay metric).

ground:
  cloth_resolution: 0.5   # CSF cloth grid
  class_threshold: 0.5    # CSF distance to cloth counted as ground
  rigidness: 3            # 1 steep terrain ... 3 flat
  refine_tolerance: 0.15  # drop "ground" points this far above local terrain (stem bases). null = off
  refine_cell: 1.0
  idw_k: 5                # height normalization: IDW neighbours
  idw_p: 2.0
  idw_rmax: 10.0

segment:
  k: 150                  # quickshift++ neighbours
  beta: 0.5               # density fluctuation: higher -> fewer, larger clusters
  voxel_size: 0.15        # downsampling for clustering only
  min_z: 1.0              # height slice used for clustering
  max_z: 4.0
  upsample: true          # fitting uses full-resolution points
  min_tree_points: 50

fit:
  breast_height: 1.3      # 1.37 in the US
  band_half_width: 0.25   # points within breast_height +- this
  confidence: 0.95
  ci_method: analytic     # analytic (cluster-robust, fast) | bootstrap (sector resampling)
  model_sd: 0.005         # systematic DBH uncertainty, 1 sd. Calibrate: `fip calibrate`
  n_bootstrap: 200
  bootstrap_block: sector # sector | point
  inlier_tolerance: 0.02
  kernel_scale: 0.03      # Geman-McClure scale
  max_radius: 0.75
  max_tilt_deg: 22.5
  ransac_iterations: 2000
  min_arc_coverage: 0.4   # quality flags
  max_relative_ci_width: 0.25
  min_inlier_ratio: 0.3
  split_stems: true       # split clusters holding several stems at breast height (merged trees)
  stem_gap: 0.15          # XY gap separating two stems in the band
