# Config for `fip inventory INPUT -c config/inventory.yaml`. Every key is optional;
# values shown are the defaults. Lengths in metres (always, even when the cloud is in feet:
# --units ft converts the cloud; config values stay metric).

ground:
  cloth_resolution: 0.5   # CSF cloth grid
  class_threshold: 0.5    # CSF distance to cloth counted as ground
  rigidness: 3            # 1 steep terrain ... 3 flat
  refine_tolerance: 0.15  # drop "ground" points this far above local terrain (stem bases). null = off
  refine_cell: 1.0
  idw_k: 5                # height normalization: IDW neighbours
  idw_p: 2.0
  idw_rmax: 10.0

segment:
  k: 150                  # quickshift++ neighbours
  beta: 0.5               # density fluctuation: higher -> fewer, larger clusters
  voxel_size: 0.15        # downsampling for clustering only
  min_z: 1.0              # height slice used for clustering
  max_z: 4.0
  upsample: true          # fitting uses full-resolution points
  min_tree_points: 50

fit:
  breast_height: 1.3      # 1.37 in the US
  band_half_width: 0.25   # points within breast_height +- this
  confidence: 0.95
  ci_method: analytic     # analytic (cluster-robust, fast) | bootstrap (sector resampling)
  model_sd: 0.005         # systematic DBH uncertainty, 1 sd. Calibrate: `fip calibrate`
  n_bootstrap: 200
  bootstrap_block: sector # sector | point
  inlier_tolerance: 0.02
  kernel_scale: 0.03      # Geman-McClure scale
  max_radius: 0.75
  max_tilt_deg: 22.5
  ransac_iterations: 2000
  min_arc_coverage: 0.6   # quality flags: stems scanned from fewer sides than this get a warning
  reject_non_stems: true       # reject shrubs, posts, walls, sparse scatter (trunk check)
  min_surface_density: 600     # points per m^2 on the seen trunk surface; ~150 for sparse scans
  min_stem_dominance: 0.5      # share of 1-2.5 m points on the trunk surface
  min_stem_continuity: 0.8     # share of 10 cm slices 1-2.5 m with trunk-surface points
  max_interior_fraction: 0.2   # share of breast-height points filling the inside
  min_top_above_breast_height: 1.0  # object must reach breast height + this (low shrubs, stumps fail)
  min_dbh: 0.0                 # stems thinner than this (m) are not trees; 0 = off (e.g. 0.10)
  min_fit_arc_coverage: 0.25   # less of the circumference seen: diameter undetermined, DBH = visible width (lower bound); 0 = off
  one_sided_arc: 0.45          # stems seen over less than this share of the circumference ...
  min_one_sided_inlier_ratio: 0.35  # ... need this share of breast-height points on the circle
  reject_roof_posts: true      # posts of sheds/carports: the material above them is one smooth roof plane
  roof_layer_fraction: 0.2     # share of the points near the best plane above the stem that lie on it (3 cm)
  roof_min_span: 0.3           # share of the 1.5 m disc around the stem the plane covers
  large_tree_dbh: 0.5          # large_tree = yes at this DBH (m) or more
  pole_action: flag            # bare column (pole, snag, or trunk with its crown out of view): flag, reject, off
  pole_min_top: 4.0            # ... seen to at least this height (m)
  short_action: flag           # short object with a large "DBH" (shrub, small tree's crown): flag, reject, off
  short_max_top: 3.6           # ... lower than this (m)
  short_min_dbh: 0.30          # ... with at least this DBH (m)
  flag_max_crown_share: 0.2    # both: less than this share of the material around the stem above 2.5 m
  complete_partial_stems: false  # true: widen the window for stems seen from one side (see README)
  max_band_half_width: 0.75      # tallest window when completing partly seen stems (m, +/- breast height)
  ovality_sd: 0.03        # assumed 1-sd non-roundness (long-short)/(long+short); widens the CI of partly seen stems
  max_relative_ci_width: 0.25
  min_inlier_ratio: 0.3
  split_stems: true       # split clusters holding several stems at breast height (merged trees)
  stem_gap: 0.15          # XY gap separating two stems in the band
